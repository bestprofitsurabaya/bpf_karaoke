services:
  # =============================================
  # DATABASE - PostgreSQL 16
  # =============================================
  karaoke_db:
    image: postgres:16-alpine
    container_name: karaoke_db
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      TZ: Asia/Jakarta
    volumes:
      - ./database/data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    restart: unless-stopped
    networks:
      - nextcloud_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-karaoke_admin} -d ${DB_NAME:-karaoke_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # REDIS - Message Broker & Cache
  # =============================================
  karaoke_redis:
    image: redis:7-alpine
    container_name: karaoke_redis
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - ./redis/data:/data
    restart: unless-stopped
    networks:
      - nextcloud_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =============================================
  # BACKEND API - FastAPI + Socket.IO
  # =============================================
  karaoke_backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karaoke_backend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@karaoke_db:5432/${DB_NAME}
      TZ: Asia/Jakarta
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MEDIA_PATH: /media/lagu
      SYNC_STATE_PATH: /srv_media/sync_state.json
      CORS_ORIGINS: "*"
      REDIS_URL: redis://karaoke_redis:6379/0
      CELERY_BROKER_URL: redis://karaoke_redis:6379/1
      CELERY_RESULT_BACKEND: redis://karaoke_redis:6379/2
      # YouTube Data API v3 (gratis 10.000 unit/hari) untuk cari lagu yg tidak ada di DB
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
    volumes:
      - /srv/karaoke_media/lagu:/media/lagu:rw
      - /srv/karaoke_media/transcoded:/media/transcoded:rw
      - /srv/karaoke_media:/srv_media:ro
      - ./backend/uploads:/app/uploads
    depends_on:
      karaoke_db:
        condition: service_healthy
      karaoke_redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextcloud_net

  # =============================================
  # CELERY WORKER - AI Background Tasks
  # =============================================
  karaoke_celery:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: karaoke_celery
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@karaoke_db:5432/${DB_NAME}
      TZ: Asia/Jakarta
      REDIS_URL: redis://karaoke_redis:6379/0
      CELERY_BROKER_URL: redis://karaoke_redis:6379/1
      CELERY_RESULT_BACKEND: redis://karaoke_redis:6379/2
      MEDIA_PATH: /media/lagu
      CATALOG_PATH: /srv_media/catalog.json
      SYNC_STATE_PATH: /srv_media/sync_state.json
      # Hapus sumber (semua format master) setelah transcode sukses
      DELETE_SOURCE_AFTER_TRANSCODE: ${DELETE_SOURCE_AFTER_TRANSCODE:-1}
      DELETE_SOURCE_EXTS: ${DELETE_SOURCE_EXTS:-.mpg,.mpeg,.avi,.mkv,.wmv,.flv,.vob,.m2v,.mpv,.3gp,.dat}
      # Webhook untuk laporan mingguan pipeline (Telegram/Discord/Slack)
      SMB_WEBHOOK_URL: ${SMB_WEBHOOK_URL:-}
    volumes:
      - /srv/karaoke_media/lagu:/media/lagu:rw
      - /srv/karaoke_media/transcoded:/media/transcoded:rw
      - /srv/karaoke_media:/srv_media:ro
    depends_on:
      karaoke_db:
        condition: service_healthy
      karaoke_redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextcloud_net

  # =============================================
  # CELERY CONTROL WORKER - Queue 'control' SAJA
  # =============================================
  # Worker ringan (concurrency=1) khusus task KONTROL (pause/resume) di queue
  # 'control'. Task ini instan (<1 dtk), TIDAK boleh mengantri di belakang
  # ffmpeg maupun scan/cleanup yang panjang — tanpa worker ini, pause manual
  # baru efektif puluhan detik kemudian. Scan/sweep/cleanup tetap di queue
  # 'maintenance' yang dikonsumsi worker utama (kadang menunggu, tapi itu OK
  # untuk task terjadwal non-urgent).
  karaoke_celery_control:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: karaoke_celery_control
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: celery -A celery_app worker --loglevel=info --concurrency=1 -Q control --hostname=control@%h
    # Share PID namespace dgn worker utama agar pkill ffmpeg di task pause
    # benar-benar membunuh ffmpeg yang berjalan di karaoke_celery (tanpa ini
    # pkill hanya melihat proses container sendiri → ffmpeg_killed=0).
    pid: "container:karaoke_celery"
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@karaoke_db:5432/${DB_NAME}
      TZ: Asia/Jakarta
      REDIS_URL: redis://karaoke_redis:6379/0
      CELERY_BROKER_URL: redis://karaoke_redis:6379/1
      CELERY_RESULT_BACKEND: redis://karaoke_redis:6379/2
      MEDIA_PATH: /media/lagu
      CATALOG_PATH: /srv_media/catalog.json
      SYNC_STATE_PATH: /srv_media/sync_state.json
      DELETE_SOURCE_AFTER_TRANSCODE: ${DELETE_SOURCE_AFTER_TRANSCODE:-1}
      DELETE_SOURCE_EXTS: ${DELETE_SOURCE_EXTS:-.mpg,.mpeg,.avi,.mkv,.wmv,.flv,.vob,.m2v,.mpv,.3gp,.dat}
      SMB_WEBHOOK_URL: ${SMB_WEBHOOK_URL:-}
    volumes:
      - /srv/karaoke_media/lagu:/media/lagu:rw
      - /srv/karaoke_media/transcoded:/media/transcoded:rw
      - /srv/karaoke_media:/srv_media:ro
    depends_on:
      karaoke_celery:
        condition: service_started
      karaoke_db:
        condition: service_healthy
      karaoke_redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextcloud_net

  # =============================================
  # KARAOKE SYNC - SMB1 Karaoke Bank (Windows XP)
  # =============================================
  karaoke_sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: karaoke_sync
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: python -m services.smb_sync
    environment:
      TZ: Asia/Jakarta
      SMB_HOST: ${SMB_HOST:-192.168.100.140}
      SMB_AUTO_DETECT: ${SMB_AUTO_DETECT:-1}
      SMB_PORT: ${SMB_PORT:-445}
      SMB_USER: ${SMB_USER:-}
      SMB_PASSWORD: ${SMB_PASSWORD:-}
      SMB_SHARES: ${SMB_SHARES:-karaoke bank 1,karaoke bank 2}
      SMB_PARALLEL: ${SMB_PARALLEL:-4}
      SMB_WEBHOOK_URL: ${SMB_WEBHOOK_URL:-}
      MEDIA_PATH: /srv_media/lagu
      SYNC_STATE_PATH: /srv_media/sync_state.json
      TRANSCODED_PATH: /srv_media/transcoded
      # Kontrol manual via panel admin (v2.7): flag pause & heartbeat di Redis
      REDIS_URL: redis://karaoke_redis:6379/0
    volumes:
      - /srv/karaoke_media:/srv_media:rw
    restart: unless-stopped
    networks:
      - nextcloud_net

  # =============================================
  # CELERY BEAT - Periodic Tasks Scheduler
  # =============================================
  karaoke_celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile.celery
    container_name: karaoke_celery_beat
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    command: celery -A celery_app beat --loglevel=warning
    environment:
      DATABASE_URL: postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@karaoke_db:5432/${DB_NAME}
      TZ: Asia/Jakarta
      REDIS_URL: redis://karaoke_redis:6379/0
      CELERY_BROKER_URL: redis://karaoke_redis:6379/1
      CELERY_RESULT_BACKEND: redis://karaoke_redis:6379/2
      MEDIA_PATH: /media/lagu
      SYNC_STATE_PATH: /srv_media/sync_state.json
      # Webhook untuk laporan mingguan pipeline (Telegram/Discord/Slack)
      SMB_WEBHOOK_URL: ${SMB_WEBHOOK_URL:-}
    volumes:
      - /srv/karaoke_media/lagu:/media/lagu:rw
      - /srv/karaoke_media:/srv_media:ro
    depends_on:
      karaoke_redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - nextcloud_net

  # =============================================
  # FRONTEND - Vue 3 PWA
  # =============================================
  karaoke_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karaoke_frontend
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    environment:
      VITE_API_URL: https://nasbpfsby.duckdns.org:8443
      VITE_WS_URL: wss://nasbpfsby.duckdns.org:8443
    depends_on:
      - karaoke_backend
    restart: unless-stopped
    networks:
      - nextcloud_net

networks:
  nextcloud_net:
    external: true
    name: nextcloud_net
